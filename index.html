<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arafi Technology - Income App</title>
<style>
body{font-family:Arial, sans-serif;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}.container{background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center;max-width:450px;width:100%;}.header{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:#fff;padding:20px;margin:-30px -30px 20px -30px;border-radius:15px 15px 0 0;}.header h1{margin:0;font-size:2em;}.header p{margin:5px 0 0 0;opacity:0.9;}.stats{display:flex;justify-content:space-around;margin-bottom:25px;background:#f8f9fa;padding:20px;border-radius:10px;border-left:4px solid #667eea;}.stat-item{flex:1;}.stat-value{font-size:2em;font-weight:bold;color:#667eea;}.stat-label{color:#666;font-size:0.9em;margin-top:8px;}.button-group{display:flex;flex-direction:column;gap:12px;}button{background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:#fff;border:none;padding:16px;border-radius:8px;cursor:pointer;font-size:1em;font-weight:bold;transition:0.3s;}button:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(102, 126, 234, 0.4);}button:disabled{opacity:.6;cursor:not-allowed;}.withdraw-btn{background:linear-gradient(135deg, #f093fb 0%, #f5576c 100%);}.referral-btn{background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.6);}.modal-content{background:#fff;margin:10% auto;padding:30px;width:90%;max-width:500px;border-radius:15px;box-shadow:0 10px 50px rgba(0,0,0,.3);animation:slideIn 0.3s ease;}@keyframes slideIn{from{transform:translateY(-50px); opacity:0;}to{transform:translateY(0); opacity:1;}}.close{float:right;font-size:32px;cursor:pointer;color:#aaa;font-weight:bold;}.close:hover{color:#000;}input{width:calc(100% - 24px);padding:14px;margin:12px 0;border:2px solid #e0e0e0;border-radius:8px;font-size:1em;box-sizing:border-box;transition:0.3s;}input:focus{outline:none;border-color:#667eea;box-shadow:0 0 10px rgba(102, 126, 234, 0.3);}.form-group{text-align:left;margin-bottom:15px;}.form-group label{display:block;margin-bottom:8px;font-weight:bold;color:#333;}.success-msg{color:#28a745;margin-top:15px;font-weight:bold;}.error-msg{color:#dc3545;margin-top:15px;font-weight:bold;}.info-box{background:linear-gradient(135deg, #667eea15 0%, #764ba215 100%);border-left:4px solid #667eea;color:#333;padding:15px;border-radius:8px;margin:15px 0;}.copy-btn{background:#667eea;margin-top:10px;width:100%;}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>💰 Arafi Technology</h1>
<p>Income Earning Application</p>
</div>
<div class="stats">
<div class="stat-item">
<div id="earned-points" class="stat-value">0</div>
<div class="stat-label">মোট পয়েন্ট</div>
</div>
<div class="stat-item">
<div id="ads-watched" class="stat-value">0</div>
<div class="stat-label">বিজ্ঞাপন দেখা</div>
</div>
</div>
<div class="button-group">
<button id="rewardBtn" disabled>🎬 বিজ্ঞাপন দেখুন</button>
<button class="withdraw-btn" onclick="openWithdrawModal()">💳 পয়েন্ট তুলুন</button>

</div>
</div>
<div id="withdrawModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeWithdrawModal()">&times;</span>
<h2>💳 পয়েন্ট তুলুন</h2>
<form id="withdrawForm">
<div class="form-group">
<label>আপনার নাম:</label>
<input type="text" id="referName" placeholder="আপনার নাম লিখুন" required>
</div>
<div class="form-group">
<label>পয়েন্ট সংখ্যা:</label>
<input type="number" id="pointsToWithdraw" placeholder="তুলতে চান এমন পয়েন্ট" min="1" required>
</div>
<div class="info-box">
✅ আপনার অনুরোধ অ্যাডমিনের কাছে পাঠানো হবে
</div>
<button type="submit">অনুরোধ পাঠান</button>
</form>
<div id="withdrawMsg"></div>
</div>
</div>

</div>
<script>
const ADSPARK_ZONE_ID = "40"; // Zone ID পরিবর্তন করতে শুধু এই লাইনটি সম্পাদনা করুন
let adsWatched = localStorage.getItem('adsWatched') ? parseInt(localStorage.getItem('adsWatched')) : 0;
let earnedPoints = localStorage.getItem('earnedPoints') ? parseInt(localStorage.getItem('earnedPoints')) : 0;
let adReady = false;
let adLoading = false;
let isProcessing = false;
function getReferralId(){
const params = new URLSearchParams(window.location.search);
return params.get('ref') || localStorage.getItem('userId') || generateUserId();
}
function generateUserId(){
let userId = localStorage.getItem('userId');
if(!userId){
userId = 'user_' + Math.random().toString(36).substr(2, 9);
localStorage.setItem('userId', userId);
}
return userId;
}
let userId = getReferralId();
function updateStats(){
document.getElementById("earned-points").innerText = earnedPoints;
document.getElementById("ads-watched").innerText = adsWatched;
localStorage.setItem("earnedPoints", earnedPoints);
localStorage.setItem("adsWatched", adsWatched);
}
function loadAdScript(){
  const script = document.createElement("script");
  script.src = "https://adspark-tma.top/api/public/sdk.js?k=" + encodeURIComponent(ADSPARK_ZONE_ID);
  script.async = true;

  script.onload = () => {
    const btn = document.getElementById("rewardBtn");
    if (typeof window.showAdspark === "function") {
      adReady = true;
      btn.disabled = false;
      btn.innerText = "🎬 বিজ্ঞাপন দেখুন";
    } else {
      btn.disabled = false;
      btn.innerText = "⚠️ বিজ্ঞাপন প্রস্তুত নয়";
    }
  };

  script.onerror = () => {
    const btn = document.getElementById("rewardBtn");
    btn.disabled = false;
    btn.innerText = "⚠️ বিজ্ঞাপন লোড হয়নি";
  };

  document.head.appendChild(script);
}

loadAdScript();

document.getElementById("rewardBtn").onclick = async function(){
  if(adLoading || !adReady || typeof window.showAdspark !== "function") return;

  const btn = this;
  btn.disabled = true;
  adLoading = true;
  btn.innerText = "⏳ বিজ্ঞাপন লোড হচ্ছে...";

  try {
    // Telegram Mini App-এর user ID AdSpark-কে পাঠানো হচ্ছে।
    const telegramUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
    if (!telegramUserId) {
      throw new Error("Telegram user ID পাওয়া যায়নি। Telegram Mini App-এর ভিতরে খুলুন।");
    }

    await window.showAdspark({ ymid: telegramUserId });

    // AdSpark-এর Promise সফল হলেই ১ পয়েন্ট যোগ হবে।
    adsWatched++;
    earnedPoints += 1;
    updateStats();
    btn.innerText = "🎬 বিজ্ঞাপন দেখুন";
  } catch(e) {
    console.error("AdSpark বিজ্ঞাপন ত্রুটি:", e);
    btn.innerText = "⚠️ বিজ্ঞাপন পাওয়া যায়নি, আবার চেষ্টা করুন";
  } finally {
    adLoading = false;
    btn.disabled = false;
  }
};

const withdrawModal = document.getElementById('withdrawModal');
function openWithdrawModal(){ withdrawModal.style.display='block'; }
function closeWithdrawModal(){ withdrawModal.style.display='none'; }
const referralModal = document.getElementById('referralModal');
window.onclick = function(e){
if(e.target == withdrawModal) closeWithdrawModal();

}
document.getElementById('withdrawForm').addEventListener('submit', function(e){
e.preventDefault();
if(isProcessing){ 
alert("⏳ অপেক্ষা করুন..."); 
return; 
}
const referName = document.getElementById('referName').value.trim();
const points = parseInt(document.getElementById('pointsToWithdraw').value);
if(!referName){
alert("❌ আপনার নাম লিখুন!");
return;
}
if(points > earnedPoints || points <= 0){
alert("❌ অবৈধ পরিমাণ! আপনার কাছে " + earnedPoints + " পয়েন্ট আছে");
return;
}
if(points < 10){
alert("❌ সর্বনিম্ন ১০ পয়েন্ট তুলতে হবে!");
return;
}
isProcessing = true;
earnedPoints -= points;
updateStats();
closeWithdrawModal();
const now = new Date();
const date = now.toLocaleDateString("en-US",{timeZone:"Asia/Dhaka"});
const time = now.toLocaleTimeString("en-US",{timeZone:"Asia/Dhaka"});
sendTelegram(referName, points, date, time, userId);
document.getElementById('withdrawForm').reset();
setTimeout(()=>{
alert("✅ অনুরোধ সফলভাবে পাঠানো হয়েছে!");
isProcessing = false;
}, 1000);
});
function sendTelegram(referName, points, date, time, userId){
const botToken = "8633433918:AAHm-IP__MT_onZ5ssOoFUMTrncprkPcmVw";
const adminChatId = "1926751288";
const message = `🚀 <b>নতুন উত্তোলন অনুরোধ</b>\n\n👤 <b>নাম:</b> ${referName}\n💰 <b>পয়েন্ট:</b> ${points}\n📅 <b>তারিখ:</b> ${date}\n🕐 <b>সময়:</b> ${time}\n🆔 <b>ব্যবহারকারী আইডি:</b> ${userId}\n\n✅ অবস্থা: অপেক্ষমাণ`;
fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:adminChatId,
text:message,
parse_mode:"HTML"
})
}).catch(err => console.error("টেলিগ্রাম ত্রুটি:", err));
}
updateStats();
</script>
</body>
</html>
